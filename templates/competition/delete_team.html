{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto text-center py-12">
  <h1 class="text-2xl font-black text-red-400 mb-4">Supprimer {{ team.name }} ?</h1>
  <p class="text-white/60 mb-6">Cette action est définitive. Tu devras te réinscrire.</p>
  <form method="post">
    {% csrf_token %}
    <button class="px-6 py-3 bg-red-600 rounded-xl font-bold mr-3">Oui, supprimer</button>
    <a href="{% url 'my_team' %}" class="px-6 py-3 bg-white/10 rounded-xl">Annuler</a>
  </form>
</div>
{% endblock %}
