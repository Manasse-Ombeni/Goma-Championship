{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto px-3 pb-20">
  <h2 class="text-2xl font-black mb-4">Classement</h2>

  {% for g, teams in data.items %}
  <div class="mb-6">
    <h3 class="font-bold mb-2 flex items-center gap-2">
      <span class="w-1 h-5 bg-amber-500 rounded"></span>
      GROUPE {{ g }}
    </h3>

    <div class="bg-[#0f172a] border border-white/10 rounded-2xl overflow-hidden">
      <div class="grid grid-cols-12 text-[11px] text-white/40 px-3 py-2 border-b border-white/5">
        <div class="col-span-6"># Équipe</div>
        <div class="col-span-2 text-center">J</div>
        <div class="col-span-2 text-center">Diff</div>
        <div class="col-span-2 text-center font-bold text-white">Pts</div>
      </div>

      {% for t in teams %}
      <div class="grid grid-cols-12 items-center px-3 py-2.5 {% if not forloop.last %}border-b border-white/5{% endif %}">
        <div class="col-span-6 flex items-center gap-2">
          <span class="w-5 text-xs text-white/50">{{ forloop.counter }}</span>
          <span class="text-sm truncate">{{ t.name }}</span>
        </div>
        <div class="col-span-2 text-center text-xs">{{ t.played }}</div>
        <div class="col-span-2 text-center text-xs">{{ t.gd }}</div>
        <div class="col-span-2 text-center font-bold">{{ t.pts }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
  {% empty %}
  <div class="text-center py-20 text-white/40">Aucun classement</div>
  {% endfor %}
</div>
{% endblock %}
