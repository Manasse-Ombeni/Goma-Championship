{% extends 'base.html' %}{% block content %}
<h2 class="text-3xl font-black mb-6">Classement</h2>
{% for g,teams in data.items %}
<h3 class="text-amber-400 font-bold mt-6 mb-2">Groupe {{g}}</h3>
<table class="w-full text-sm bg-white/5 rounded-xl overflow-hidden">
<tr class="text-white/50"><th class="text-left p-2">Équipe</th><th>Pts</th><th>J</th><th>Diff</th></tr>
{% for t in teams %}<tr class="border-t border-white/10"><td class="p-2">{{t.name}}</td><td class="text-center">{{t.pts}}</td><td class="text-center">{{t.played}}</td><td class="text-center">{{t.gd}}</td></tr>{% endfor %}
</table>
{% endfor %}
{% endblock %}
