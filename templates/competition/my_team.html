{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-black mb-6">Mon Équipe</h1>
  
  <div class="bg-[#0f172a] p-6 rounded-2xl border border-white/10">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h2 class="text-2xl font-bold">{{ team.name }}</h2>
        <p class="text-white/60">@{{ team.owner.username }}</p>
      </div>
      <span class="px-3 py-1 rounded-full text-xs {% if team.is_validated %}bg-emerald-500/20 text-emerald-400{% else %}bg-amber-500/20 text-amber-400{% endif %}">
        {% if team.is_validated %}Validée{% else %}En attente{% endif %}
      </span>
    </div>
    
    <div class="space-y-2 text-sm mb-6">
      <p><b>WhatsApp:</b> {{ team.whatsapp }}</p>
      <p><b>Pseudo:</b> {{ team.pseudo|default:"-" }}</p>
    </div>
    
    <div class="grid grid-cols-2 gap-3">
      <a href="{% url 'edit_team' %}" class="p-3 bg-sky-600 rounded-xl text-center font-bold">Modifier</a>
      <a href="{% url 'change_password' %}" class="p-3 bg-white/10 rounded-xl text-center">Mot de passe</a>
      <a href="{% url 'delete_team' %}" class="col-span-2 p-3 bg-red-600/20 text-red-400 rounded-xl text-center">Supprimer mon équipe</a>
    </div>
  </div>
</div>
{% endblock %}
