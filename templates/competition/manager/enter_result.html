{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-20 bg-[#0f172a] p-8 rounded-2xl border border-white/10">
  <h1 class="text-2xl font-bold mb-6 text-center">{{ match.home }} vs {{ match.away }}</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div class="flex items-center gap-4">
      <input type="number" name="home_goals" min="0" max="20" class="w-full text-4xl text-center bg-black/50 p-4 rounded-xl" value="{{ match.home_goals }}" autofocus>
      <span class="text-2xl">-</span>
      <input type="number" name="away_goals" min="0" max="20" class="w-full text-4xl text-center bg-black/50 p-4 rounded-xl" value="{{ match.away_goals }}">
    </div>
    <button class="w-full py-3 bg-emerald-600 rounded-xl font-bold">Enregistrer</button>
  </form>
</div>
{% endblock %}
