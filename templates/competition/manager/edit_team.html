{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-black mb-6">Modifier {{ team.name }}</h1>
  <form method="post" class="space-y-4 bg-[#0f172a] p-6 rounded-2xl">
    {% csrf_token %}
    {% for field in form %}
      {% if not field.is_hidden %}
        <div>
          <label class="block text-sm mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
          {% endif %}
        </div>
      {% endif %}
    {% endfor %}
    <button class="w-full py-3 bg-emerald-600 rounded-xl font-bold">Enregistrer</button>
  </form>
</div>
{% endblock %}
