{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto py-8">
  <h1 class="text-2xl font-bold mb-6 text-center">Équipes Validées — {{ teams|length }} / 32</h1>

  <div class="space-y-2">
    {% for team in teams %}
    <div class="bg-[#0f172a] p-4 rounded-xl flex justify-between items-center">
      <div>
        <div class="font-semibold">{{ team.name }}</div>
        <div class="text-sm text-white/60">@{{ team.owner.username }}</div>
      </div>
      {% if team.whatsapp %}
      <a href="https://wa.me/{{ team.whatsapp|cut:'+'|cut:' ' }}" target="_blank"
         class="bg-green-600 px-3 py-1 rounded-lg text-sm">
        WhatsApp
      </a>
      {% endif %}
    </div>
    {% empty %}
    <div class="text-center text-white/50 py-10">Aucune équipe</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
